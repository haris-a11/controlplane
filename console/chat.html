<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ControlPlane — chat</title>
<link rel="stylesheet" href="/shell.css">
<style>
.app{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:0;
  height:calc(100vh - 52px)}
.left{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.right{overflow-y:auto;background:var(--surface-2);padding:18px 20px 60px}

.setup{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
  padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.setup .grow{flex:1;min-width:0}

.thread{flex:1;overflow-y:auto;padding:22px 20px;display:flex;
  flex-direction:column;gap:14px}
.msg{max-width:min(74ch,88%);border-radius:12px;padding:11px 14px;font-size:.93rem;
  white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);
  border-bottom-left-radius:4px;cursor:pointer}
.msg.bot.sel{outline:2px solid var(--accent);outline-offset:1px}
.msg.bot .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:.75rem;
  color:var(--text-muted)}
.msg .hedge{display:block;margin-top:9px;padding:8px 10px;border-radius:7px;
  background:color-mix(in srgb,var(--annotate) 12%,transparent);
  border-left:3px solid var(--annotate);font-size:.83rem;color:var(--text-secondary)}
.msg.err{align-self:center;background:color-mix(in srgb,var(--block) 12%,transparent);
  border:1px solid var(--block);color:var(--text-primary);font-size:.85rem}
.typing{align-self:flex-start;color:var(--text-muted);font-size:.85rem;
  display:flex;gap:8px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--text-muted);
  animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

.composer{display:flex;gap:9px;padding:14px 20px;border-top:1px solid var(--line);
  background:var(--surface-2)}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:150px;
  border-radius:9px;line-height:1.45}
.samples{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 12px;background:var(--surface-2)}
.samples button{font-size:.76rem;padding:4px 9px;border-radius:14px;
  color:var(--text-secondary)}

.insp h3{margin-top:18px;display:flex;align-items:center;gap:8px}
.insp h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.83rem;
  align-items:baseline}
.kv dt{color:var(--text-muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;margin-bottom:9px}
.span-row{display:flex;align-items:center;gap:9px;font-size:.79rem;margin-bottom:7px}
.span-row .meter{flex:1}
.span-row .sc{font-variant-numeric:tabular-nums;min-width:34px;text-align:right;
  color:var(--text-secondary)}
.quote{font-size:.8rem;color:var(--text-secondary);border-left:2px solid var(--line-strong);
  padding-left:9px;margin-top:7px;white-space:pre-wrap;max-height:120px;overflow-y:auto}
.sig{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;
  padding:5px 0;border-bottom:1px solid var(--line)}
.sig:last-child{border-bottom:0}
.sig b{font-weight:600;font-variant-numeric:tabular-nums}
.budget{display:flex;align-items:center;gap:8px;font-size:.78rem;margin-top:7px}
.diff{font-size:.82rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:170px;
  overflow-y:auto;color:var(--text-secondary)}
.replay-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.replay-out{font-size:.8rem;margin-top:9px;color:var(--text-secondary)}
.fb{display:flex;gap:7px;margin-top:8px}
@media (max-width:1000px){
  .app{grid-template-columns:1fr;height:auto}
  .right{border-top:1px solid var(--line)}
  .thread{min-height:46vh}
}
</style>
<div id="bar"></div>
<div class="app">
  <div class="left">
    <div class="setup">
      <div><label for="uc">Use case</label>
        <select id="uc">
          <option value="support">support — customer-facing</option>
          <option value="copilot">copilot — internal</option>
          <option value="decision_support">decision_support — regulated</option>
        </select></div>
      <div><label for="user">User</label>
        <input type="text" id="user" value="u_demo" size="12"></div>
      <div class="grow" id="polsum"></div>
    </div>

    <div class="thread" id="thread"></div>

    <div class="samples" id="samples"></div>
    <div class="composer">
      <textarea id="q" rows="1" placeholder="Ask the insurance assistant…"></textarea>
      <button class="primary" id="send">Send</button>
    </div>
  </div>

  <div class="right"><div class="insp" id="insp"></div></div>
</div>

<script src="/shell.js"></script>
<script>
$("#bar").innerHTML = topbar("/chat");

const SAMPLES = [
  "When is maternity covered?",
  "Since cataract has no waiting period, can I claim in month 2?",
  "What is the room rent cap?",
  "Are ambulance charges reimbursed?",
  "My policy is MHA/889201 and my email is r.mehta@example.com — what is my room rent cap?",
  "How long do you actually take to settle a claim, 30 or 45 days?",
];
let POLICIES = {}, turns = [], selected = null;

$("#samples").innerHTML = SAMPLES.map((s, i) =>
  `<button data-i="${i}" title="${esc(s)}">${esc(s.length > 46 ? s.slice(0, 44) + "…" : s)}</button>`).join("");
$("#samples").onclick = e => {
  const b = e.target.closest("button");
  if (b) { $("#q").value = SAMPLES[+b.dataset.i]; $("#q").focus(); }
};

api("/api/policies").then(p => { POLICIES = p; policySummary(); });
$("#uc").onchange = policySummary;

function policySummary() {
  const p = POLICIES[$("#uc").value];
  if (!p) return;
  $("#polsum").innerHTML = `<label>Policy in effect</label>
    <div style="font-size:.79rem;color:var(--text-secondary)" class="mono">
      block&lt;${p.grounding_block} · hedge&lt;${p.grounding_annotate} ·
      pii:${p.pii_action} · ungoverned:${p.ungoverned_action} ·
      ${p.allow_repair ? "repair ok" : "no repair"} · budget ${p.latency_budget_ms}ms</div>`;
}

/* --- sending ---------------------------------------------------------------- */
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#send").onclick = send;

function bubble(cls, html) {
  const d = document.createElement("div");
  d.className = `msg ${cls}`;
  d.innerHTML = html;
  $("#thread").append(d);
  $("#thread").scrollTop = $("#thread").scrollHeight;
  return d;
}

async function send() {
  const text = $("#q").value.trim();
  if (!text) return;
  $("#q").value = "";
  $("#send").disabled = true;
  bubble("user", esc(text));
  const wait = document.createElement("div");
  wait.className = "typing";
  wait.innerHTML = `<i></i><i></i><i></i> generating, then checking…`;
  $("#thread").append(wait);
  $("#thread").scrollTop = $("#thread").scrollHeight;

  try {
    const r = await api("/v1/chat/completions", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-controlplane-use-case": $("#uc").value,
        "x-controlplane-user": $("#user").value.trim() || "anon",
      },
      body: JSON.stringify({ messages: [{ role: "user", content: text }] }),
    });
    wait.remove();
    const cp = r.controlplane;
    const answer = r.choices[0].message.content;
    const turn = { question: text, answer, cp };
    turns.push(turn);
    renderAnswer(turn);
    select(turns.length - 1);
  } catch (e) {
    wait.remove();
    bubble("err", `Request failed: ${esc(e.message)}`);
  } finally {
    $("#send").disabled = false;
    $("#q").focus();
  }
}

/** The hedge the router appended is rendered as a callout, not as body text —
    a warning that reads like part of the answer is a warning nobody sees. */
function renderAnswer(turn) {
  const i = turns.indexOf(turn), cp = turn.cp;
  const [body, ...notes] = turn.answer.split("\n\n> ⚠️ ");
  const d = bubble("bot", `${esc(body)}${
    notes.map(n => `<span class="hedge">⚠️ ${esc(n)}</span>`).join("")}
    <div class="meta">${actionPill(cp.action)} ${tierPath(cp.tier_path)}
      <span>${esc(cp.reason)}</span>
      <span>· ${ms(cp.check_ms)} checking${cp.over_budget ? " ⚠ over budget" : ""}</span>
      ${cp.ungoverned_sources.length ? `<span class="badge ungoverned">stale source</span>` : ""}
    </div>`);
  d.dataset.i = i;
  d.onclick = () => select(i);
}

$("#thread").addEventListener("click", e => {
  const m = e.target.closest(".msg.bot");
  if (m) select(+m.dataset.i);
});

function select(i) {
  selected = i;
  $$(".msg.bot").forEach(m => m.classList.toggle("sel", +m.dataset.i === i));
  inspect(turns[i]);
}

/* --- the inspector ---------------------------------------------------------
   Every mechanism the request went through, in the order it ran. This panel is
   the point of the page: the checking is the product, so it is shown rather
   than summarised into a single score. */
function inspect(t) {
  if (!t) return;
  const cp = t.cp, s = cp.signals, p = cp.policy;
  const lp = s.logprobs_available;
  const g = cp.grounding;

  const spans = (cp.sources || []).map((src, i) => {
    const sc = (cp.span_scores || [])[i];
    const best = i === cp.best_span;
    return `<div class="span-row" title="${esc(src.id)}">
      ${govBadge(src.governance)}
      <span class="meter"><i style="width:${((sc ?? 0) * 100).toFixed(0)}%;
        background:var(--${best ? "accent" : "line-strong"})"></i></span>
      <span class="sc">${sc == null ? "—" : sc.toFixed(2)}</span>
      ${best ? "<b style='font-size:.7rem;color:var(--accent)'>best</b>" : ""}
    </div>`;
  }).join("");
  const bestSrc = (cp.sources || [])[cp.best_span];

  $("#insp").innerHTML = `
    <h3>Decision</h3>
    <div class="card">
      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        ${actionPill(cp.action)} ${tierPath(cp.tier_path)}
        <span class="mono muted" style="font-size:.78rem">${esc(cp.reason)}</span>
      </div>
      <div class="budget">
        <span class="meter" title="checking time against this profile's budget">
          <i style="width:${Math.min(100, cp.check_ms / p.latency_budget_ms * 100).toFixed(0)}%;
            background:var(--${cp.over_budget ? "block" : "pass"})"></i></span>
        <span class="muted">${ms(cp.check_ms)} added / ${p.latency_budget_ms} ms budget
          · ${ms(cp.latency_ms)} end to end</span>
      </div>
      <div class="fb">
        <button class="sm" data-fb="agree">👍 correct call</button>
        <button class="sm" data-fb="false_positive">👎 over-flagged</button>
        <button class="sm" data-fb="false_negative">⚠ missed an error</button>
      </div>
      <div class="replay-out" id="fbout"></div>
    </div>

    <h3>Tier 0 · free signals <span class="badge">no model call</span></h3>
    <div class="card">
      <div class="sig"><span>Mean log-probability</span>
        <b>${lp ? s.mean_logprob.toFixed(3) : "unavailable"}</b></div>
      <div class="sig"><span>Weakest token</span>
        <b>${lp ? s.min_logprob.toFixed(3) : "—"}</b></div>
      <div class="sig"><span>PII detected</span>
        <b style="color:var(--${Object.keys(s.pii).length ? "redact" : "text-primary"})">
          ${Object.keys(s.pii).length ? Object.keys(s.pii).join(", ") : "none"}</b></div>
      <div class="sig"><span>Re-ask within 60 s</span><b>${s.reask ? "yes" : "no"}</b></div>
      <div class="sig"><span>Answer declined</span><b>${s.abstains ? "yes" : "no"}</b></div>
      <div class="sig"><span>Question asserts a premise</span>
        <b>${s.asserts_premise ? "yes → judge" : "no"}</b></div>
      <div class="sig"><span>Retrieval score</span>
        <b>${s.retrieval == null ? "—" : s.retrieval.toFixed(3)}</b></div>
      ${lp ? "" : `<p class="hint" style="margin:9px 0 0">This provider returns no
        token log-probabilities, so Tier 0 is running degraded. The router escalates
        to full verification rather than assuming the answer was confident.</p>`}
    </div>

    <h3>Tier 1 · grounding <span class="badge">${esc(cp.tier1_reason)}</span></h3>
    <div class="card">
      ${cp.tier1_ran ? `
        <div class="sig"><span>Best span score</span>
          <b style="color:var(--${g >= p.grounding_annotate ? "pass"
            : g >= p.grounding_block ? "annotate" : "block"})">
          ${g == null ? "—" : g.toFixed(3)}</b></div>
        <div style="margin-top:10px">${spans}</div>
        ${bestSrc ? `<div class="quote">${esc(bestSrc.text.slice(0, 420))}</div>
          <div class="muted" style="font-size:.75rem;margin-top:6px">
            ${esc(bestSrc.source)} · ${esc(bestSrc.governance)}</div>` : ""}`
      : `<p class="muted" style="margin:0;font-size:.83rem">Not run — ${esc(cp.tier1_reason)}.</p>`}
    </div>

    <h3>Tier 2 · AI judge <span class="badge">${esc(cp.judge_reason)}</span></h3>
    <div class="card">
      ${cp.judge_ran && cp.judge ? `
        <div class="sig"><span>Verdict</span>
          <b style="color:var(--${["contradicted","false_premise"].includes(cp.judge.verdict)
            ? "block" : "pass"})">${esc(cp.judge.verdict ?? "unavailable")}</b></div>
        <div class="sig"><span>Confidence</span>
          <b>${cp.judge.confidence == null ? "—" : cp.judge.confidence.toFixed(2)}</b></div>
        <p class="hint" style="margin:9px 0 0">${esc(cp.judge.reason || "")}</p>`
      : `<p class="muted" style="margin:0;font-size:.83rem">Not run — ${esc(cp.judge_reason)}.
         Tier 2 costs a second model call, so it runs where it can change the outcome.</p>`}
    </div>

    ${cp.ungoverned_sources.length ? `
      <h3>Data governance</h3>
      <div class="card">
        <p style="margin:0 0 7px;font-size:.83rem">The only span supporting this answer
        came from a source that is not under document governance:</p>
        ${cp.ungoverned_sources.map(s => `<span class="badge ungoverned">${esc(s)}</span>`).join(" ")}
        <p class="hint" style="margin:9px 0 0">Groundedness cannot see this — the answer
        really is faithful to what it was shown. This profile's
        <code>ungoverned_action</code> is <code>${esc(p.ungoverned_action)}</code>.</p>
      </div>` : ""}

    ${cp.original_answer ? `
      <h3>What the model originally said</h3>
      <div class="card"><div class="diff">${esc(cp.original_answer)}</div></div>` : ""}

    <h3>Cost and latency</h3>
    <div class="card">
      <dl class="kv">
        <dt>Generation</dt><dd>${ms(cp.generated_ms)}</dd>
        <dt>Checking (wall clock)</dt><dd>${ms(cp.check_ms)}</dd>
        <dt>Checking if run in series</dt><dd>${ms(cp.sequential_ms)}
          ${cp.sequential_ms > cp.check_ms
            ? `<span class="badge ok">−${ms(cp.sequential_ms - cp.check_ms)} parallel</span>` : ""}</dd>
        <dt>Acting on the decision</dt><dd>${ms(cp.action_ms)}${cp.action_ms > 200
          ? ` <span class="muted">— a repair is a second generation</span>` : ""}</dd>
        <dt>Model spend</dt><dd>${usd(cp.cost_usd)}
          <span class="badge${cp.cost_source === "estimated" ? "" : " ok"}"
            title="Provider pricing is not always published; an estimate is labelled as one."
            >${esc(cp.cost_source || "unknown")}</span></dd>
        <dt>Checking spend</dt><dd>${usd(cp.check_cost_usd)}</dd>
        <dt>Overhead</dt><dd>${cp.cost_usd
          ? pct(cp.check_cost_usd / (cp.cost_usd + cp.check_cost_usd)) : "—"}</dd>
      </dl>
    </div>

    <h3>Same answer, another profile</h3>
    <div class="card">
      <p class="hint" style="margin:0 0 4px">Re-decides this stored response under a
      different policy. No second model call — <code>decide()</code> is pure, which is
      what makes one engine produce three behaviours from config alone.</p>
      <div class="replay-row">
        ${Object.keys(POLICIES).filter(u => u !== cp.use_case).map(u =>
          `<button class="sm" data-replay="${u}">${esc(u)}</button>`).join("")}
      </div>
      <div class="replay-out" id="replayout"></div>
    </div>

    <h3>Audit</h3>
    <div class="card"><dl class="kv">
      <dt>Decision</dt><dd class="mono">#${cp.decision_id}</dd>
      <dt>User</dt><dd>${esc(cp.user)}</dd>
      <dt>Use case</dt><dd>${esc(cp.use_case)}</dd>
    </dl>
    <p class="hint" style="margin:8px 0 0">
      <a href="/dashboard?decision=${cp.decision_id}">Open in the dashboard →</a></p></div>`;

  $$("[data-replay]").forEach(b => b.onclick = async () => {
    const r = await api(`/api/replay/${cp.decision_id}?use_case=${b.dataset.replay}`,
      { method: "POST" });
    $("#replayout").innerHTML = `Under <b>${esc(r.use_case)}</b> this same response would be
      ${actionPill(r.action)} <span class="mono muted">${esc(r.reason)}</span>
      — it was ${actionPill(r.was.action)} under <b>${esc(r.was.use_case)}</b>.`;
  });

  $$("[data-fb]").forEach(b => b.onclick = async () => {
    try {
      await api("/api/feedback", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ decision_id: cp.decision_id, verdict: b.dataset.fb,
                               reviewer: $("#user").value || "anon" }),
      });
      $("#fbout").textContent = "Recorded. It feeds the threshold recommendation "
        + "on the dashboard.";
      $$("[data-fb]").forEach(x => x.disabled = true);
    } catch (e) { $("#fbout").textContent = `Could not record: ${e.message}`; }
  });
}

$("#insp").innerHTML = `<div class="empty">Ask something to see how it was checked.<br><br>
  Every response is inspected here: the free Tier 0 signals, the grounding score
  against each retrieved span, the judge's verdict when one was needed, what the
  router decided and why, and what it cost.</div>`;
$("#q").focus();
</script>
